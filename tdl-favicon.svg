<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="#4f46e5"/>
  
  <!-- Subtle gradient overlay -->
  <rect width="32" height="32" rx="5" fill="url(#gradient)" opacity="0.3"/>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  
  <!-- TDL Text -->
  <text x="16" y="21" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">TDL</text>
  
  <!-- Subtle glow effect -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="white" stroke-width="0.5" opacity="0.2"/>
</svg>
