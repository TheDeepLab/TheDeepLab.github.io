<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TheDeepLab - Page Not Found">
    <title>Page Not Found | TheDeepLab</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="font-sans antialiased text-gray-900 bg-gray-50 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="w-full z-10 bg-white bg-opacity-95 shadow-sm">
        <div class="container mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center">
                <a href="/" class="text-2xl font-bold text-indigo-600">TheDeepLab</a>
            </div>
            <div class="hidden md:flex items-center space-x-8">
                <a href="/#features" class="text-gray-700 hover:text-indigo-600 transition">Features</a>
                <a href="/#benefits" class="text-gray-700 hover:text-indigo-600 transition">Benefits</a>
                <a href="/#testimonials" class="text-gray-700 hover:text-indigo-600 transition">Testimonials</a>
                <a href="/#contact" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">Contact Us</a>
            </div>
        </div>
    </nav>

    <!-- 404 Content -->
    <div class="flex-grow flex items-center justify-center">
        <div class="container mx-auto px-6 py-16 text-center">
            <div class="mb-8">
                <i class="fas fa-robot text-indigo-600 text-8xl"></i>
            </div>
            <h1 class="text-4xl md:text-6xl font-bold mb-4">404</h1>
            <h2 class="text-2xl md:text-3xl font-bold mb-6">Page Not Found</h2>
            <p class="text-xl text-gray-600 max-w-xl mx-auto mb-8">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <div class="mb-12">
                <a href="/" class="px-8 py-3 bg-indigo-600 text-white font-medium rounded-md hover:bg-indigo-700 transition inline-block">
                    Back to Home
                </a>
            </div>
            <div class="bg-white p-8 rounded-lg shadow-md max-w-md mx-auto">
                <h3 class="text-xl font-bold mb-4">Looking for something specific?</h3>
                <p class="text-gray-600 mb-4">
                    Our AI agents might be able to help you find what you need.
                </p>
                <a href="/#contact" class="px-6 py-2 bg-gray-100 text-gray-800 font-medium rounded-md hover:bg-gray-200 transition inline-block">
                    Contact Support
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-4 md:mb-0">
                    <a href="/" class="text-2xl font-bold text-white">TheDeepLab</a>
                </div>
                <p class="text-gray-400 text-sm">
                    &copy; 2025 TheDeepLab
                </p>
            </div>
        </div>
    </footer>

</html>
